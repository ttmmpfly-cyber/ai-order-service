services:
  db:
    image: postgres:16
    container_name: ai_order_db

    environment:
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: postgres
     POSTGRES_DB: ai_order_service

    ports:
     - "5432:5432"

    volumes:
     - postgres_data:/var/lib/postgresql/data
  
  api:
   build: .
   container_name: ai_order_api

   command:
    uvicorn main:app --host 0.0.0.0 --port 8000
  
   ports:
    - "8000:8000"

   env_file:
    - .env
   
   environment:
    DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ai_order_service
    MCP_URL: http://mcp:8001/mcp
  
   depends_on:
   - db

  mcp:
   build: .
   container_name: ai_order_mcp

   command:
    python -m mcp_app.server

   ports:
    - "8001:8001"

   env_file:
    - .env

   environment:
    DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ai_order_service

   depends_on:
    - db

volumes:
 postgres_data: